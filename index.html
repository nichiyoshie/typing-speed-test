<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Typing Test</title>
    <script>
        try {
            var saved = localStorage.getItem("typing-theme");
            if (saved === "light" || saved === "dark") {
                document.documentElement.setAttribute("data-theme", saved);
            }
        } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/typing.css">
</head>
<body>
    <main class="app">
        <header class="top">
            <div>
                <h1>Typing Test</h1>
                <p class="subtitle">How fast can you type?</p>
            </div>
            <button class="switch" id="theme-switch" type="button" role="switch" aria-checked="true" aria-label="Dark mode">
                <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <span class="knob"></span>
            </button>
        </header>

        <div class="modes" role="group" aria-label="How long">
            <button class="mode" data-time="15" type="button">15 sec</button>
            <button class="mode active" data-time="30" type="button">30 sec</button>
            <button class="mode" data-time="60" type="button">60 sec</button>
        </div>

        <div class="stats">
            <div class="stat blue"><span>Time</span><strong id="time">30</strong></div>
            <div class="stat green"><span>WPM</span><strong id="wpm">0</strong></div>
            <div class="stat yellow"><span>Accuracy</span><strong id="acc">100%</strong></div>
            <div class="stat red"><span>Best</span><strong id="best">–</strong></div>
        </div>

        <div class="typing-box unfocused" id="box">
            <div class="words" id="words" aria-hidden="true"></div>
            <p class="focus-hint">Click here and start typing!</p>
            <input id="input" class="hidden-input" type="text"
                   autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                   aria-label="Type the text shown above">
        </div>

        <div class="actions">
            <button class="btn" id="restart" type="button">Try again</button>
            <span class="tip">or press Esc</span>
        </div>

        <div class="result" id="result" hidden aria-live="polite">
            <p class="result-title" id="r-title">Great job!</p>
            <div class="result-grid">
                <div class="stat green"><span>WPM</span><strong id="r-wpm">0</strong></div>
                <div class="stat yellow"><span>Accuracy</span><strong id="r-acc">0%</strong></div>
                <div class="stat blue"><span>Correct letters</span><strong id="r-chars">0</strong></div>
            </div>
            <p class="result-note" id="r-note"></p>
        </div>
    </main>

    <script>
        (function () {
            var root = document.documentElement;
            var button = document.getElementById("theme-switch");

            function paint() {
                var dark = root.getAttribute("data-theme") !== "light";
                button.setAttribute("aria-checked", dark ? "true" : "false");
            }

            button.addEventListener("click", function () {
                var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
                root.setAttribute("data-theme", next);
                try { localStorage.setItem("typing-theme", next); } catch (e) {}
                paint();
                var input = document.getElementById("input");
                if (input && !input.disabled) input.focus();
            });

            paint();
        })();
    </script>
    <script src="js/typing.js"></script>
</body>
</html>
