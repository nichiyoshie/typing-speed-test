<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Typing Speed Test</title>
    <script>
        // Apply the saved theme before the page paints, so there is no flash.
        try {
            const saved = localStorage.getItem("typing-theme");
            if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        } catch (e) {}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/typing.css">
</head>
<body>
    <main class="typing">
        <header class="top">
            <h1>Typing test</h1>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <span id="theme-label">Light</span>
            </button>
        </header>

        <div class="modes" role="group" aria-label="Test duration">
            <button class="mode" data-time="15">15s</button>
            <button class="mode active" data-time="30">30s</button>
            <button class="mode" data-time="60">60s</button>
        </div>

        <div class="stats">
            <div class="stat"><span>Time</span><strong id="time">30</strong></div>
            <div class="stat main"><span>WPM</span><strong id="wpm">0</strong></div>
            <div class="stat"><span>Accuracy</span><strong id="acc">100%</strong></div>
            <div class="stat"><span>Best</span><strong id="best">–</strong></div>
        </div>

        <div class="typing-box unfocused" id="box">
            <div class="words" id="words" aria-hidden="true"></div>
            <p class="focus-hint" id="hint">Click here or start typing</p>
            <input id="input" class="hidden-input" type="text"
                autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                aria-label="Type the text shown above">
        </div>

        <div class="actions">
            <button class="btn" id="restart" type="button">Restart</button>
            <span class="tip">or press Esc</span>
        </div>

        <div class="result" id="result" hidden aria-live="polite">
            <p class="result-title">Time's up</p>
            <div class="result-grid">
                <div><span>WPM</span><strong class="main" id="r-wpm">0</strong></div>
                <div><span>Accuracy</span><strong id="r-acc">0%</strong></div>
                <div><span>Correct characters</span><strong id="r-chars">0</strong></div>
            </div>
            <p class="result-note" id="r-note"></p>
        </div>
    </main>

    <script src="js/typing.js"></script>
</body>
</html>
